name: Runing Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      
      - name: Install
        run: npm ci
      
      - name: Build 
        run: npm run build

      - name: Test
        run: npm run test
